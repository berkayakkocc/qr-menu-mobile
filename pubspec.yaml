name: qr_menu_mobile
description: QR Menu SaaS mobile - Admin panel + Kitchen screen
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.4
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  http: ^1.2.2
  mobile_scanner: ^6.0.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false

flutter_native_splash:
  color: "#2563EB"
  image: assets/icon.png
  android_12:
    color: "#2563EB"
    image: assets/icon.png
  fullscreen: false

flutter:
  uses-material-design: true
  assets:
    - assets/
